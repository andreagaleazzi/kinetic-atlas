<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Kinetic Atlas link preview</title>
<!-- Source of /og.png, the link-preview image. Re-render after editing:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars --window-size=1200,630 --screenshot=og.png "file://$PWD/docs/brand/og.html" -->
<link rel="stylesheet" href="tokens.css">
<style>
  html, body { margin:0; }
  body { width:1200px; height:630px; overflow:hidden; position:relative; font-family:var(--font-sans); color:var(--text);
    background:radial-gradient(ellipse 780px 450px at 8% -20%, var(--glow-teal), transparent 75%), radial-gradient(ellipse 960px 510px at 97% -20%, var(--glow-violet), transparent 70%), var(--bg); }
  .mark { position:absolute; left:66px; top:66px; display:block; }
  .words { position:absolute; left:66px; bottom:33px; }
  .name { margin:0; font-size:132px; line-height:.92; font-weight:850; letter-spacing:-.045em; }
  .tag { max-width:440px; margin:22px 0 0 6px; font-size:26px; line-height:34px; color:var(--muted); }
  .art { position:absolute; right:0; top:0; }
  .alc { fill:var(--alc); }
  .caf { fill:var(--caf); }
  .nic { fill:var(--nic); }
</style>
</head>
<body>
<svg class="mark" width="86" height="86" viewBox="0 0 43 43" fill="none" aria-hidden="true"><rect width="43" height="43" rx="14" fill="#b1ead1"/><path transform="translate(8.5 8.5)" d="M2.75 20C3.51 16.4 4.27 15 5.32 15C6.93 15 8.17 20 12.25 20M7.66 17.26C8.41 12.8 9.2 11 10.22 11C12.09 11 13.52 20 18.25 20M12.37 13.92C13.1 7.95 13.87 5.5 14.86 5.5C16.81 5.5 18.3 20 23.25 20" stroke="#11241d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
<!-- the brandmark's three dose curves at 36x, filled in the compound hues, back to front: each starts later and peaks higher, the smaller in front; a bg-coloured outline parts them; baseline one line 33px above the edge, the tallest tail bleeding off the right -->
<svg class="art" width="620" height="630" viewBox="0 0 620 630" aria-hidden="true">
<g transform="translate(-99 -123) scale(36)" stroke="var(--bg)" stroke-width=".33" stroke-linejoin="round">
<path class="caf" d="M11.7 20C12.8 8 13.87 5.5 14.86 5.5C16.81 5.5 18.3 20 23.25 20Z"/>
<path class="alc" d="M7 20C7.9 13 9.2 11 10.22 11C12.09 11 13.52 20 18.25 20Z"/>
<path class="nic" d="M2.75 20C3.51 16.4 4.27 15 5.32 15C6.93 15 8.17 20 12.25 20Z"/>
</g>
</svg>
<div class="words">
<h1 class="name">Kinetic<br>Atlas</h1>
<p class="tag">Alcohol, caffeine and nicotine, modelled on one timeline.</p>
</div>
</body>
</html>
