<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Kinetic Atlas link preview</title>
<!-- Source of /og.png, the link-preview image. Re-render after editing:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars --window-size=1200,630 --screenshot=og.png "file://$PWD/docs/brand/og.html" -->
<link rel="stylesheet" href="tokens.css">
<style>
  html, body { margin:0; }
  body { width:1200px; height:630px; overflow:hidden; position:relative; font-family:var(--font-sans); color:var(--text);
    background:radial-gradient(ellipse 780px 450px at 8% -20%, var(--glow-teal), transparent 75%), radial-gradient(ellipse 960px 510px at 97% -20%, var(--glow-violet), transparent 70%), var(--bg); }
  .mark { position:absolute; left:66px; top:66px; display:block; }
  .words { position:absolute; left:66px; bottom:33px; }
  .name { margin:0; font-size:132px; line-height:.92; font-weight:850; letter-spacing:-.045em; }
  .tag { max-width:440px; margin:22px 0 0 6px; font-size:26px; line-height:34px; color:var(--muted); }
  .art { position:absolute; right:0; top:0; }
  .mint, .dot { fill:var(--primary); }
  .alc { fill:var(--alc); }
  .caf { fill:var(--caf); }
  .nic { fill:var(--nic); }
</style>
</head>
<body>
<svg class="mark" width="86" height="86" viewBox="0 0 43 43" fill="none" aria-hidden="true"><rect width="43" height="43" rx="14" fill="#b1ead1"/><path transform="translate(8.5 8.5)" d="M3 16.5h4l3.2-9 5.1 12 3-7H23" stroke="#11241d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
<!-- the gallery cover's staircase at 1.5x: primary bleeds off the top, nicotine off the right, bottoms one line 33px above the edge -->
<svg class="art" width="620" height="630" viewBox="0 0 620 630" aria-hidden="true">
<rect class="mint" x="0" y="-32" width="198" height="629" rx="32"/>
<rect class="alc" x="224" y="297" width="132" height="300" rx="32"/>
<rect class="caf" x="382" y="387" width="132" height="210" rx="32"/>
<rect class="nic" x="540" y="489" width="213" height="108" rx="32"/>
<g id="dots"></g>
</svg>
<div class="words">
<h1 class="name">Kinetic<br>Atlas</h1>
<p class="tag">Alcohol, caffeine and nicotine, modelled on one timeline.</p>
</div>
<script>
// dot grid from the cover: 20px pitch, column heights decaying 7 to 1, floating above the caffeine slab
const g = document.getElementById('dots');
[7,6,5,4,3,2,2,2,1,1,1,1].forEach((h, c) => { for (let r = 0; r < h; r++) g.insertAdjacentHTML('beforeend', `<circle class="dot" cx="${394 + c*20}" cy="${345 - r*20}" r="4"/>`); });
</script>
</body>
</html>
